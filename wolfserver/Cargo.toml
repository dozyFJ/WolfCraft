[package]
name = "wolfserver"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "WolfServer"
path = "src/main.rs"

[dependencies]
wolfcraft-net = { path = "../wolfcraft-net" }
wolfcraft-engine.workspace = true
wolfcraft-common.workspace = true
serde_json.workspace = true
toml.workspace = true
serde.workspace = true
mlua = { version = "0.12.2", features = ["luau", "send"] }
getrandom = "0.3.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

