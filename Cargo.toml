[workspace]
resolver = "3"
members = [
    "wolfcraft-common",
    "wolfcraft-assets",
    "wolfcraft-engine",
    "wolfcraft-ui",
    "wolfcraft-game",
    "wolfcraft-launcher",
    "wolfcraft-net",
    "wolfserver",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wolfcraft-common = { path = "wolfcraft-common" }
wolfcraft-assets = { path = "wolfcraft-assets" }
wolfcraft-engine = { path = "wolfcraft-engine" }
wolfcraft-ui = { path = "wolfcraft-ui" }
wolfcraft-net = { path = "wolfcraft-net" }

wgpu = "22.1"
winit = "0.30.13"
egui = "0.29.1"
egui-wgpu = "0.29.1"
egui-winit = { version = "0.29.1", default-features = false, features = ["links", "clipboard"] }
glam = { version = "0.29", features = ["bytemuck"] }
rayon = "1.10"
noise = "0.9"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rodio = { version = "0.19", default-features = false }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

