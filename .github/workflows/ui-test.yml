name: UI tap test

on:
  push:
    branches: [mobile-explosives]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-test
      - name: Tap on a nearby server joins it
        run: cargo test -p wolfcraft-ui --lib -- main_menu studio_ui --nocapture
      - name: Destruction physics and weapons
        run: cargo test -p wolfcraft-engine --lib -- collapse explosives --nocapture
      - name: Invite codes
        run: cargo test -p wolfcraft-net --lib -- invite --nocapture
      - name: Luau block events
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev pkg-config
          cargo test -p wolfcraft-game --lib -- luau_scripts --nocapture
