name: Android APK

on:
  push:
    branches: [mobile-explosives, codex/ota-launchers]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: two runs publishing "latest" together can clobber each other.
concurrency:
  group: android-apk-test
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: cargo-apk
        run: cargo install cargo-apk --locked || cargo install cargo-apk

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Build APK (arm64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/ci/wolfcraft-release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          unset ANDROID_SDK_ROOT
          echo "SDK=$ANDROID_HOME NDK=$ANDROID_NDK_ROOT"
          ls "$ANDROID_NDK_ROOT/source.properties"
          cargo apk build -p wolfcraft-game --lib --release --target aarch64-linux-android
          ls -l target/release/apk/
          # Only the signed, aligned APK (never the "-unaligned" intermediate).
          cp target/release/apk/WolfCraft.apk WolfCraft.apk
          ls -lh WolfCraft.apk
          # Refuse to publish a package Android would reject.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs WolfCraft.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 WolfCraft.apk | tail -1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the one-time APK shell and signed native OTA
        run: |
          mkdir -p game-pocket/app/src/main/jniLibs/arm64-v8a
          python3 - <<'PYCODE'
          import pathlib, zipfile
          target=pathlib.Path('game-pocket/app/src/main/jniLibs/arm64-v8a')
          with zipfile.ZipFile('WolfCraft.apk') as z:
              for name in z.namelist():
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
                      (target/pathlib.Path(name).name).write_bytes(z.read(name))
          PYCODE
          export OTA_SHELL_HASH="$(python3 tools/shell_hash.py game)"
          export OTA_SAVE_FORMAT="$(sed -n 's/.*pub const SAVE_FORMAT: u32 = \([0-9]*\).*/\1/p' wolfcraft-common/src/version.rs)"
          gradle -p game-pocket --no-daemon assembleRelease
          cp game-pocket/app/build/outputs/apk/release/app-release.apk WolfCraft.apk
          python3 tools/check_shell_apk.py game WolfCraft.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs WolfCraft.apk
          python3 tools/build_ota.py --kind game --input game-pocket/app/src/main/jniLibs/arm64-v8a --output game-ota --build "$GITHUB_SHA" --sequence "$GITHUB_RUN_ID" --keystore ci/wolfcraft-release.keystore --shell-hash "$OTA_SHELL_HASH" --nm "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          bash tools/check_ota.sh game game-ota

      - uses: actions/upload-artifact@v4
        with:
          name: WolfCraft-apk
          path: |
            WolfCraft.apk
            game-ota/*

  studio:
    uses: ./.github/workflows/server-pocket.yml
    secrets: inherit

  publish:
    needs: [apk, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WolfCraft-apk

      - uses: actions/download-artifact@v4
        with:
          name: WolfStudio-apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=test
          if [ "$GITHUB_REF_NAME" = "codex/ota-launchers" ]; then tag=ota-bootstrap; fi
          gh release delete "$tag" -y --cleanup-tag || true
          gh release create "$tag" WolfCraft.apk WolfStudio.apk --prerelease --target "$GITHUB_SHA" \
            --title "WolfCraft и WolfStudio · Android (#${{ github.run_number }})" \
            --notes "Установи APK игры или редактора. Дальше совместимые ядра обновляются кнопкой в лаунчере. ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
          gh release delete game-ota -y --cleanup-tag || true
          gh release create game-ota game-ota/* --prerelease --target "$GITHUB_SHA" \
            --title "WolfCraft native OTA ${GITHUB_SHA::7}" \
            --notes "Подписанное ядро arm64 для APK-загрузчика. Обновляется внутри приложения."
