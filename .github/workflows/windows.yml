name: WolfCraft for Windows (exe)

on:
  push:
    branches: [mobile-explosives]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wolfcraft-windows
  cancel-in-progress: true

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + Windows target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - uses: Swatinem/rust-cache@v2
        with:
          key: wolfcraft-windows

      - name: Build WolfCraft.exe
        run: |
          cargo build -p wolfcraft-game --bin WolfCraft --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/WolfCraft.exe WolfCraft.exe
          ls -lh WolfCraft.exe

      - name: Publish (release pc-test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-test -y --cleanup-tag || true
          gh release create pc-test WolfCraft.exe --prerelease --target "$GITHUB_SHA" \
            --title "WolfCraft для ПК (Windows) #${{ github.run_number }}" \
            --notes "Та же игра, что на телефоне. Скачай WolfCraft.exe и запусти. ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
