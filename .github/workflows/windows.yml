name: WolfCraft for Windows (exe)

on:
  push:
    branches: [mobile-explosives]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wolfcraft-windows
  cancel-in-progress: true

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + Windows target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - uses: Swatinem/rust-cache@v2
        with:
          key: wolfcraft-windows

      - name: Build Windows executables
        run: |
          # Everything linked in (libstdc++, libgcc, winpthread): the exe needs no MinGW DLLs
          # on the player's PC.
          # Luau (C++) asks for libstdc++ as a DLL: link the static library instead.
          GCCLIB="$(dirname "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++.a)")"
          export CXXSTDLIB=static=stdc++
          export RUSTFLAGS="-L native=$GCCLIB -C target-feature=+crt-static -C link-arg=-static -C link-arg=-static-libgcc -C link-arg=-static-libstdc++"
          cargo build -p wolfcraft-game --bin WolfCraft --release --target x86_64-pc-windows-gnu
          cargo build -p wolfstudio --bin WolfStudio --release --target x86_64-pc-windows-gnu
          cargo build -p wolfserver --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/{WolfCraft,WolfStudio,WolfServer}.exe .
          ls -lh WolfCraft.exe
          echo "DLLs the exe needs:"
          for exe in WolfCraft.exe WolfStudio.exe WolfServer.exe; do
            x86_64-w64-mingw32-objdump -p "$exe" | grep "DLL Name" | sort -u
            if x86_64-w64-mingw32-objdump -p "$exe" | grep -qiE "libstdc|libgcc|libwinpthread"; then
              echo "$exe still requires a MinGW DLL"
              exit 1
            fi
          done

      - name: Publish (release pc-test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-test -y --cleanup-tag || true
          gh release create pc-test WolfCraft.exe WolfStudio.exe WolfServer.exe --prerelease --target "$GITHUB_SHA" \
            --title "WolfCraft для ПК (Windows) #${{ github.run_number }}" \
            --notes "WolfCraft.exe — игра. WolfStudio.exe — редактор серверов и мини-игр. WolfServer.exe — выделенный сервер. ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
