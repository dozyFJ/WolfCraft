name: WolfStudio app (studio + server) + WolfServer PC

on:
  push:
    branches: [mobile-explosives, codex/ota-launchers]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wolfserver-pocket
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: wolfserver

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      - name: WolfServer for Android (arm64)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo build -p wolfserver --lib --release --target aarch64-linux-android
          mkdir -p wolfserver-pocket/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libwolfserver_runtime.so wolfserver-pocket/app/src/main/jniLibs/arm64-v8a/

      - name: Studio library for Android (arm64)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          NDK="$ANDROID_NDK_ROOT"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo build -p wolfstudio --lib --release --target aarch64-linux-android
          J=wolfserver-pocket/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libwolfstudio.so $J/
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" $J/
          ls -lh $J/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: WolfServer Pocket APK
        working-directory: wolfserver-pocket
        run: |
          export OTA_SHELL_HASH="$(cd .. && python3 tools/shell_hash.py studio)"
          export OTA_SAVE_FORMAT="$(sed -n 's/.*pub const SAVE_FORMAT: u32 = \([0-9]*\).*/\1/p' ../wolfcraft-common/src/version.rs)"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../WolfStudio.apk
          python3 ../tools/check_shell_apk.py studio ../WolfStudio.apk
          ls -lh ../WolfStudio.apk

      - name: Sign and publish native studio/server OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OTA_SHELL_HASH="$(python3 tools/shell_hash.py studio)"
          python3 tools/build_ota.py --kind studio --input wolfserver-pocket/app/src/main/jniLibs/arm64-v8a --output studio-ota --build "$GITHUB_SHA" --sequence "$GITHUB_RUN_ID" --keystore ci/wolfcraft-release.keystore --shell-hash "$OTA_SHELL_HASH" --nm "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          bash tools/check_ota.sh studio studio-ota
          tag=server-test
          if [ "$GITHUB_REF_NAME" = "codex/ota-launchers" ]; then tag=studio-ota-bootstrap; fi
          gh release delete "$tag" -y --cleanup-tag || true
          gh release create "$tag" WolfStudio.apk --prerelease --target "$GITHUB_SHA" \
            --title "WolfStudio + WolfServer · OTA-загрузчик (#${{ github.run_number }})" \
            --notes "Установи APK один раз. Кнопка обновления меняет совместимые ядра редактора и сервера без APK. ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
          gh release delete studio-ota -y --cleanup-tag || true
          gh release create studio-ota studio-ota/* --prerelease --target "$GITHUB_SHA" \
            --title "WolfStudio native OTA ${GITHUB_SHA::7}" \
            --notes "Подписанные ядра редактора и сервера arm64 для APK-загрузчика."

      - name: WolfServer for Windows (PC)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
          cargo build -p wolfserver --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/WolfServer.exe WolfServer.exe
          ls -lh WolfServer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WolfServer
          path: |
            WolfStudio.apk
            WolfServer.exe
            studio-ota/*
          if-no-files-found: ignore

      - name: Attach Windows server
        if: ${{ hashFiles('WolfServer.exe') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=server-test
          if [ "$GITHUB_REF_NAME" = "codex/ota-launchers" ]; then tag=studio-ota-bootstrap; fi
          gh release upload "$tag" WolfServer.exe --clobber
