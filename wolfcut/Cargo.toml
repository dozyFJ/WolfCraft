[package]
name = "wolfcut"
version = "0.2.3"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
android_logger = "0.14"
log = "0.4"

[workspace]
resolver = "3"
