[package]
name = "wolfcut"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde_json = "1"
tempfile = "3"

[workspace]
resolver = "3"
